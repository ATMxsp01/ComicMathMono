name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 构建
        run: python3 build.py

      - name: 回归校验（含 OTS / emoji 序列 shaping）
        run: python3 tools/verify.py

      # 构建是可复现的（build.py 自己会带 PYTHONHASHSEED=0 重启，head 时间戳固定为
      # SOURCE_DATE_EPOCH）。所以重建后 dist/ 必须与仓库里提交的一模一样 —— 一旦有 diff，
      # 说明「改了源码忘了重新构建提交」，或者可复现性被破坏了。
      - name: 校验 dist/ 与源码一致（可复现构建）
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ 与源码不一致：请运行 python3 build.py 并把 dist/ 一起提交。"
            git diff --stat -- dist/
            exit 1
          fi
          echo "dist/ 与源码一致 ✓"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ComicMathMono
          path: dist/*.ttf
          if-no-files-found: error
